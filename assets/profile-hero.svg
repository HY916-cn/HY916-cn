<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Haoyu Huang — Built to run</title>
  <desc id="desc">Profile banner for Haoyu Huang, focused on web systems, native macOS tools, and server infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B11"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8FF3D"/>
      <stop offset="1" stop-color="#55E6FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8DA0BB" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" stroke="#94A8C5" stroke-opacity="0.22" stroke-width="2"/>

  <g opacity="0.75">
    <circle cx="42" cy="35" r="5" fill="#FF6B6B"/>
    <circle cx="60" cy="35" r="5" fill="#FFD166"/>
    <circle cx="78" cy="35" r="5" fill="#C8FF3D"/>
    <text x="104" y="41" fill="#8292A9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5">hy916://profile</text>
    <text x="1128" y="41" fill="#8292A9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="end">SINGAPORE · UTC+8</text>
  </g>
  <path d="M72 76H1128" stroke="url(#accent)" stroke-opacity="0.38"/>

  <text x="72" y="130" fill="#C8FF3D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="4">HAOYU HUANG / HY916</text>
  <text x="67" y="215" fill="#F4F7FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">BUILT TO RUN.</text>
  <text x="72" y="258" fill="#9BAAC0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.1">WEB SYSTEMS · NATIVE MACOS · SERVER INFRA</text>
  <g transform="translate(72 293)">
    <rect width="11" height="19" rx="2" fill="#55E6FF"/>
    <text x="25" y="15" fill="#DCE5F2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Useful software for real problems.</text>
  </g>

  <g transform="translate(898 105)">
    <rect width="230" height="190" rx="12" fill="#0A1019" stroke="#8292A9" stroke-opacity="0.3"/>
    <text x="20" y="31" fill="#8292A9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">FOCUS</text>
    <path d="M20 47H210" stroke="#8292A9" stroke-opacity="0.22"/>

    <text x="20" y="81" fill="#C8FF3D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">01</text>
    <text x="53" y="81" fill="#DCE5F2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">SELF-HOSTED WEB</text>
    <text x="20" y="120" fill="#55E6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">02</text>
    <text x="53" y="120" fill="#DCE5F2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">NATIVE MACOS</text>
    <text x="20" y="159" fill="#C8FF3D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">03</text>
    <text x="53" y="159" fill="#DCE5F2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">SERVER SYSTEMS</text>
  </g>
